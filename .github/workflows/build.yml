# Native builds (ADR 0002)

Runs `scripts/build.sh` on Ubuntu / macOS / Windows.
Docker images are a separate Linux product (`Dockerfile` + `build.sh --cpu`).

name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_args: --cpu
          - os: macos-latest
            build_args: ""
          - os: windows-latest
            build_args: --cpu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Runtime package set
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh ${{ matrix.build_args }}
