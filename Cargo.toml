[workspace]
resolver = "2"
members = ["cli/transcribe/vd-giga"]
default-members = ["cli/transcribe/vd-giga"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Vladimir Yazykov <neizerth@gmail.com>"]
repository = "https://github.com/neizerth/voxdecoder"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Noise for CLI / early crates — tighten later if needed.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
