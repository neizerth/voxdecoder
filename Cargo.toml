[workspace]
resolver = "2"
members = [
    "src/crates/vd-artifact",
    "src/crates/vd-output",
    "src/crates/vd-progress",
    "src/crates/vd-input",
    "src/crates/vd-text",
    "src/crates/vd-classify",
    "src/cli/process/vd-assets",
    "src/cli/process/vd-pipeline",
    "src/cli/process/vd-diarize",
    "src/cli/process/vd-meeting",
    "src/cli/process/vd-preprocess",
    "src/cli/process/vd-postprocess",
    "src/cli/process/vd-url",
    "src/cli/manage/vd-srv",
    "src/cli/manage/vd-mcp",
    "src/cli/manage/vdctl",
    "src/cli/transcribe/vd-gigaam",
    "src/cli/fix/vd-fix-casing",
    "src/cli/fix/vd-fix-asr",
    "src/cli/fix/vd-fix-terms",
    "src/cli/fix/vd-fix-layout",
    "src/cli/fix/vd-fix-disfluency",
    "src/cli/fix/vd-fix-overlap",
]
default-members = [
    "src/crates/vd-artifact",
    "src/crates/vd-output",
    "src/crates/vd-progress",
    "src/crates/vd-input",
    "src/crates/vd-text",
    "src/crates/vd-classify",
    "src/cli/process/vd-assets",
    "src/cli/process/vd-pipeline",
    "src/cli/process/vd-diarize",
    "src/cli/process/vd-meeting",
    "src/cli/process/vd-preprocess",
    "src/cli/process/vd-postprocess",
    "src/cli/process/vd-url",
    "src/cli/manage/vd-srv",
    "src/cli/manage/vd-mcp",
    "src/cli/manage/vdctl",
    "src/cli/transcribe/vd-gigaam",
    "src/cli/fix/vd-fix-casing",
    "src/cli/fix/vd-fix-asr",
    "src/cli/fix/vd-fix-terms",
    "src/cli/fix/vd-fix-layout",
    "src/cli/fix/vd-fix-disfluency",
    "src/cli/fix/vd-fix-overlap",
]
exclude = [
    "src/desktop/src-tauri",
]


[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Vladimir Yazykov <neizerth@gmail.com>"]
repository = "https://github.com/neizerth/voxdecoder"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Noise for CLI / early crates — tighten later if needed.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
struct_excessive_bools = "allow"
missing_const_for_fn = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
format_push_string = "allow"
map_unwrap_or = "allow"
redundant_clone = "allow"
suboptimal_flops = "allow"
or_fun_call = "allow"
branches_sharing_code = "allow"
manual_assert_eq = "allow"
manual_is_multiple_of = "allow"
cast_lossless = "allow"
