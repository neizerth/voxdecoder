[package]
name = "vd-fix-casing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local presentation fixer CLI (punctuation, casing, whitespace)"
publish = false

[[bin]]
name = "vd-fix-casing"
path = "src/main.rs"

[lib]
name = "vd_fix_casing"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
