# Built-in AI client adapters for `vdctl discover` / `mcp list` / `mcp install`.
# Override: place `agents.toml` next to `vdctl.toml` (same config dir).
#
# kind: desktop | cli | custom
#   desktop → install MCP Bundle / JSON config
#   cli     → register via app MCP CLI (e.g. `claude mcp add`)
#
# mcp_format: mcp_servers | servers | mcp | stdio | none
#   mcp_servers → Cursor / Claude Desktop / Gemini (`mcpServers`)
#   servers     → VS Code (`servers`)
#   mcp         → OpenCode (`mcp` + local entry shape)
#   stdio       → Crush (`mcp` + stdio entry shape)
#   none        → skills only (e.g. ChatGPT)
# skill_dirs: where `skills/<id>/skill.md` is linked for that client
# Path tokens: `~`, `$HOME`, `$XDG_CONFIG_HOME`, `%APPDATA%`, `%LOCALAPPDATA%`, `%USERPROFILE%`.

[[agent]]
id = "claude-desktop"
name = "Claude Desktop"
kind = "desktop"
mcp_format = "mcp_servers"
skill_dirs = ["~/.claude/skills"]

[agent.macos]
app_paths = [
  "/Applications/Claude.app",
  "~/Applications/Claude.app",
]
config_paths = [
  "~/Library/Application Support/Claude/claude_desktop_config.json",
]
skill_dirs = ["~/Library/Application Support/Claude/skills"]

[agent.linux]
app_paths = [
  "/opt/Claude/claude",
  "~/.local/share/Claude",
]
config_paths = [
  "~/.config/Claude/claude_desktop_config.json",
  "$XDG_CONFIG_HOME/Claude/claude_desktop_config.json",
]

[agent.windows]
app_paths = [
  "%LOCALAPPDATA%/AnthropicClaude/claude.exe",
  "%LOCALAPPDATA%/Programs/Claude/Claude.exe",
]
config_paths = [
  "%APPDATA%/Claude/claude_desktop_config.json",
]
skill_dirs = ["%USERPROFILE%/.claude/skills"]

[[agent]]
id = "claude-code"
name = "Claude Code"
kind = "cli"
bins = ["claude"]
mcp_server_name = "voxdecoder"
mcp_scope = "user"
skill_dirs = ["~/.claude/skills"]
config_paths = ["~/.claude.json"]

[agent.windows]
bins = ["claude.exe"]
skill_dirs = ["%USERPROFILE%/.claude/skills"]
config_paths = ["%USERPROFILE%/.claude.json"]

[[agent]]
id = "cursor"
name = "Cursor"
kind = "desktop"
mcp_format = "mcp_servers"
marker_dirs = ["~/.cursor"]
config_paths = ["~/.cursor/mcp.json"]
skill_dirs = ["~/.cursor/skills"]

[agent.macos]
app_paths = [
  "/Applications/Cursor.app",
  "~/Applications/Cursor.app",
]
config_paths = [
  "~/Library/Application Support/Cursor/User/globalStorage/cursor.mcp/mcp.json",
]

[agent.linux]
app_paths = [
  "/opt/Cursor/cursor",
  "/usr/share/cursor",
  "~/.local/share/cursor",
]
bins = ["cursor"]

[agent.windows]
app_paths = [
  "%LOCALAPPDATA%/Programs/cursor/Cursor.exe",
  "%LOCALAPPDATA%/Programs/Cursor/Cursor.exe",
]
config_paths = [
  "%USERPROFILE%/.cursor/mcp.json",
]
skill_dirs = ["%USERPROFILE%/.cursor/skills"]

[[agent]]
id = "chatgpt"
name = "ChatGPT Desktop"
kind = "desktop"
mcp_format = "none"
skill_dirs = ["~/.voxdecoder/skills/chatgpt"]

[agent.macos]
app_paths = [
  "/Applications/ChatGPT.app",
  "~/Applications/ChatGPT.app",
]

[agent.linux]
app_paths = [
  "/opt/ChatGPT/chatgpt",
  "~/.local/share/ChatGPT",
]

[agent.windows]
app_paths = [
  "%LOCALAPPDATA%/Programs/ChatGPT/ChatGPT.exe",
  "%LOCALAPPDATA%/OpenAI/ChatGPT/ChatGPT.exe",
]
skill_dirs = ["%USERPROFILE%/.voxdecoder/skills/chatgpt"]

[[agent]]
id = "vscode"
name = "VS Code"
kind = "desktop"
mcp_format = "servers"
bins = ["code"]
skill_dirs = ["~/.vscode/skills"]

[agent.macos]
app_paths = [
  "/Applications/Visual Studio Code.app",
  "~/Applications/Visual Studio Code.app",
]
config_paths = [
  "~/Library/Application Support/Code/User/mcp.json",
]

[agent.linux]
app_paths = [
  "/usr/share/code",
  "/usr/share/code-oss",
  "/opt/visual-studio-code",
  "~/.local/share/code",
]
config_paths = [
  "~/.config/Code/User/mcp.json",
  "~/.config/Code - OSS/User/mcp.json",
  "$XDG_CONFIG_HOME/Code/User/mcp.json",
]

[agent.windows]
app_paths = [
  "%LOCALAPPDATA%/Programs/Microsoft VS Code/Code.exe",
  "%ProgramFiles%/Microsoft VS Code/Code.exe",
]
config_paths = [
  "%APPDATA%/Code/User/mcp.json",
]
skill_dirs = ["%USERPROFILE%/.vscode/skills"]

[[agent]]
id = "codex"
name = "Codex CLI"
kind = "cli"
bins = ["codex"]
marker_dirs = ["~/.codex"]
config_paths = ["~/.codex/config.toml"]
skill_dirs = ["~/.codex/skills"]
# No MCP CLI adapter yet — detection only.

[agent.windows]
marker_dirs = ["%USERPROFILE%/.codex"]
config_paths = ["%USERPROFILE%/.codex/config.toml"]
skill_dirs = ["%USERPROFILE%/.codex/skills"]

[[agent]]
id = "opencode"
name = "OpenCode"
kind = "cli"
mcp_format = "mcp"
bins = ["opencode"]
marker_dirs = ["~/.config/opencode", "$XDG_CONFIG_HOME/opencode"]
config_paths = [
  "~/.config/opencode/opencode.json",
  "~/.config/opencode/opencode.jsonc",
  "$XDG_CONFIG_HOME/opencode/opencode.json",
  "$XDG_CONFIG_HOME/opencode/opencode.jsonc",
]
skill_dirs = [
  "~/.config/opencode/skills",
  "$XDG_CONFIG_HOME/opencode/skills",
]

[agent.windows]
bins = ["opencode.exe"]
marker_dirs = [
  "%USERPROFILE%/.config/opencode",
  "%LOCALAPPDATA%/opencode",
]
config_paths = [
  "%USERPROFILE%/.config/opencode/opencode.json",
  "%USERPROFILE%/.config/opencode/opencode.jsonc",
  "%LOCALAPPDATA%/opencode/opencode.json",
]
skill_dirs = [
  "%USERPROFILE%/.config/opencode/skills",
  "%LOCALAPPDATA%/opencode/skills",
]

[[agent]]
id = "crush"
name = "Crush"
kind = "cli"
mcp_format = "stdio"
bins = ["crush"]
marker_dirs = ["~/.config/crush", "$XDG_CONFIG_HOME/crush"]
config_paths = [
  "~/.config/crush/crush.json",
  "$XDG_CONFIG_HOME/crush/crush.json",
]
skill_dirs = [
  "~/.config/crush/skills",
  "$XDG_CONFIG_HOME/crush/skills",
]

[agent.windows]
bins = ["crush.exe"]
marker_dirs = [
  "%LOCALAPPDATA%/crush",
  "%USERPROFILE%/.config/crush",
]
config_paths = [
  "%LOCALAPPDATA%/crush/crush.json",
  "%USERPROFILE%/.config/crush/crush.json",
]
skill_dirs = [
  "%LOCALAPPDATA%/crush/skills",
  "%USERPROFILE%/.config/crush/skills",
]

[[agent]]
id = "gemini"
name = "Gemini CLI"
kind = "cli"
mcp_format = "mcp_servers"
bins = ["gemini"]
marker_dirs = ["~/.gemini"]
config_paths = ["~/.gemini/settings.json"]
skill_dirs = ["~/.gemini/skills", "~/.agents/skills"]

[agent.windows]
bins = ["gemini.exe", "gemini.cmd"]
marker_dirs = ["%USERPROFILE%/.gemini"]
config_paths = ["%USERPROFILE%/.gemini/settings.json"]
skill_dirs = [
  "%USERPROFILE%/.gemini/skills",
  "%USERPROFILE%/.agents/skills",
]