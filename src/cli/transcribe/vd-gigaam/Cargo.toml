[package]
name = "vd-gigaam"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local GigaAM transcription CLI (Rust + Candle)"
publish = false

[[bin]]
name = "vd-gigaam"
path = "src/main.rs"

[lib]
name = "vd_gigaam"
path = "src/lib.rs"

[features]
# On macOS: `cargo build -p vd-gigaam --features metal` (see package.json build:vd-gigaam).
default = []
metal = ["candle-core/metal"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
hound = "3.5"
md-5 = "0.10"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
ureq = "2.12"
vd-output = { path = "../../../crates/vd-output" }
vd-progress = { path = "../../../crates/vd-progress" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
