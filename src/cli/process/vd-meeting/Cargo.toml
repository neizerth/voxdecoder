[package]
name = "vd-meeting"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Meeting Planner: MeetingRequest + BuildOptions → Job → shared Executor"
publish = false

[[bin]]
name = "vd-meeting"
path = "src/main.rs"

[lib]
name = "vd_meeting"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"
vd-artifact = { path = "../../../crates/vd-artifact" }
vd-progress = { path = "../../../crates/vd-progress" }
vd-pipeline = { path = "../vd-pipeline" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_yaml = "0.9"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
