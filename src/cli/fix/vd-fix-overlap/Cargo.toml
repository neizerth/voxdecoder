[package]
name = "vd-fix-overlap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local diarization-overlap duplicate-speech remover CLI"
publish = false

[[bin]]
name = "vd-fix-overlap"
path = "src/main.rs"

[lib]
name = "vd_fix_overlap"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
vd-artifact = { path = "../../../crates/vd-artifact" }
vd-output = { path = "../../../crates/vd-output" }
vd-text = { path = "../../../crates/vd-text" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
