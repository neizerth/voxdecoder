[package]
name = "voxdecoder-desktop"
version = "0.1.0"
description = "VoxDecoder desktop client (Tauri)"
authors = ["Vladimir Yazykov <neizerth@gmail.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "voxdecoder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
