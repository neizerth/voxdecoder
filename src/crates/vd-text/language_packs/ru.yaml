# Russian language pack — Russian-specific filler words, discourse markers, normalization

# Russian filler words (sounds, hesitations, discourse fillers)
- id: ru-filler-eee
  confidence: certain
  when:
    type: token
    value: 'эээ'
  action:
    type: remove

- id: ru-filler-ee
  confidence: certain
  when:
    type: token
    value: 'ээ'
  action:
    type: remove

- id: ru-filler-mmm
  confidence: certain
  when:
    type: token
    value: 'ммм'
  action:
    type: remove

- id: ru-filler-mm
  confidence: certain
  when:
    type: token
    value: 'мм'
  action:
    type: remove

- id: ru-filler-ugu
  confidence: certain
  when:
    type: token
    value: 'угу'
  action:
    type: remove

- id: ru-filler-aga
  confidence: certain
  when:
    type: token
    value: 'ага'
  action:
    type: remove

- id: ru-filler-aha
  confidence: certain
  when:
    type: token
    value: 'аха'
  action:
    type: remove

# Russian discourse markers (may be optional in disfluency cleanup)
- id: ru-discourse-tipis
  confidence: likely
  when:
    type: token
    value: 'типа'
  action:
    type: remove

- id: ru-discourse-tak-skazat
  confidence: likely
  when:
    type: token
    value: 'так сказать'
  action:
    type: remove

- id: ru-discourse-kak-by
  confidence: likely
  when:
    type: token
    value: 'как бы'
  action:
    type: remove

- id: ru-discourse-vrode
  confidence: likely
  when:
    type: token
    value: 'вроде'
  action:
    type: remove

# Repeated word rule (for "hello hello" → "hello")
- id: ru-repeated-word
  confidence: likely
  when:
    type: repeated_word
  action:
    type: remove_second

# Merged word (token split): "goodmorning" → "good morning"
- id: ru-merged-word
  confidence: likely
  when:
    type: merged_word
  action:
    type: split

# Orphan letters (ADR 014) — single letters used as hesitation
- id: ru-orphan-letter-ya
  confidence: likely
  when:
    type: orphan_letter
    value: 'я'
  action:
    type: remove

- id: ru-orphan-letter-e
  confidence: likely
  when:
    type: orphan_letter
    value: 'э'
  action:
    type: remove

- id: ru-orphan-letter-m
  confidence: likely
  when:
    type: orphan_letter
    value: 'м'
  action:
    type: remove

- id: ru-orphan-letter-n
  confidence: likely
  when:
    type: orphan_letter
    value: 'н'
  action:
    type: remove

# Stuttering (ADR 014) — repeated syllables (я-я, по-по)
- id: ru-stutter-ya-ya
  confidence: certain
  when:
    type: stutter
    pattern: 'я-я'
  action:
    type: remove

- id: ru-stutter-po-po
  confidence: certain
  when:
    type: stutter
    pattern: 'по-по'
  action:
    type: remove

- id: ru-stutter-n-n
  confidence: certain
  when:
    type: stutter
    pattern: 'н-н'
  action:
    type: remove

- id: ru-stutter-i-i
  confidence: certain
  when:
    type: stutter
    pattern: 'и-и'
  action:
    type: remove
